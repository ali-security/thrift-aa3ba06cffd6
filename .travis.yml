# build Apache Thrift on Travis CI - https://travis-ci.com/

#
# Sealed build (agentic-sealer): the upstream matrix runs every leg through
# build/docker/run.sh after `travis_wait 40 build/docker/refresh.sh`, which
# rebuilds the whole polyglot thrift-build Docker image from source (kerl Erlang,
# .NET, Haskell, Rust, D, Dart, Swift, ...) and never reaches a verdict on the
# fork. This config runs the Java library leg of that matrix directly on the VM,
# with the same toolchain upstream's GitHub lib-java job uses (JDK 17 toolchain,
# Gradle 8.4): build the thrift compiler, build lib/java (`make -C lib/java`) and
# run its unit-test suite (`make -C lib/java check` = gradle test against code
# generated by the freshly built compiler).
#

dist: focal
language: minimal

env:
  global:
    - GRADLE_VERSION="8.4"
    - BUILD_DEPS="automake bison flex git libboost-all-dev libevent-dev libssl-dev libtool make pkg-config g++"
    - CONFIG_ARGS_FOR_LIBS="--disable-debug --disable-dependency-tracking --without-cpp --without-c_glib --with-java --without-kotlin --without-python --without-py3 --without-ruby --without-haxe --without-netstd --without-perl --without-php --without-php_extension --without-dart --without-erlang --without-go --without-d --without-nodejs --without-nodets --without-lua --without-rs --without-swift"

jobs:
  include:
    - name: "Java library (lib/java, JDK 17)"

install:
  - sudo apt-get update -yq
  - sudo apt-get install -y --no-install-recommends $BUILD_DEPS openjdk-17-jdk-headless wget unzip ant
  - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
  - export PATH="$JAVA_HOME/bin:$PATH"
  - java -version
  - wget https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip -q -O /tmp/gradle-$GRADLE_VERSION-bin.zip
  - (echo "3e1af3ae886920c3ac87f7a91f816c0c7c436f276a6eefdb3da152100fef72ae  /tmp/gradle-$GRADLE_VERSION-bin.zip" | sha256sum -c -)
  # the Travis image ships its own /usr/local/bin/gradle: put Gradle 8.4 first on PATH instead
  - unzip -q -d $HOME /tmp/gradle-$GRADLE_VERSION-bin.zip
  - export PATH="$HOME/gradle-$GRADLE_VERSION/bin:$PATH"
  - gradle --version
  # Gradle's Test task is silent on success: print per-test results and totals
  - mkdir -p ~/.gradle/init.d && cp .seal/test-logging.init.gradle ~/.gradle/init.d/

script:
  - ./bootstrap.sh
  - ./configure $CONFIG_ARGS_FOR_LIBS
  - make -j$(nproc) -C compiler/cpp
  - compiler/cpp/thrift -version
  - make -C lib/java
  - make -C lib/java check

after_script:
  - sh .seal/wait-for-log.sh lib-java
