// Sealed-build helper (not part of upstream Thrift): Gradle's Test task is
// silent on success, so print one line per test and a per-suite total.
// Copied into ~/.gradle/init.d/ by .travis.yml and .github/workflows/seal-build.yml.
allprojects {
    tasks.withType(Test).configureEach {
        testLogging {
            events "passed", "skipped", "failed"
            exceptionFormat "full"
        }
        afterSuite { desc, result ->
            if (!desc.parent) {
                println "TEST SUMMARY (${project.name}:${name}): ${result.resultType} - ${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped"
            }
        }
    }
}
